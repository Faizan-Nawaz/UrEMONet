<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History — UrEMONet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

</head>
<body style="background-color: var(--hero-bg, #f3f6f1);">

<nav>
  <a class="nav-logo" href="index.html">
    <div class="nav-logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4C12 9 15 12 20 12C15 12 12 15 12 20C12 15 9 12 4 12C9 12 12 9 12 4Z" />
        <circle cx="5.5" cy="17.5" r="2.2" />
        <path d="M18 4.5H22M20 2.5V6.5" stroke-width="1.9" />
      </svg>
    </div>
    <span>UrEMONet</span>
  </a>

  <ul class="nav-links">
    <li><a href="index.html" id="nav-home">Home</a></li>
    <li><a href="detect.html" id="nav-detect">Detect</a></li>
    <li><a href="history.html" id="nav-history" class="active">History</a></li>
    <li><a href="about.html" id="nav-about">About</a></li>
  </ul>

  <div id="user-nav-status" style="position: relative; display: flex; align-items: center;">
    <a href="login.html" class="nav-btn">Log In</a>
    <a href="signup.html" class="nav-btn primary">Sign Up</a>
  </div>
</nav>

<!-- Outer Container set to light background -->
<div class="light-container-page" id="page-detect" style="min-height: 85vh; padding: 3rem 1.5rem; background-color: #f7f8f7;">
  <div class="history-container" style="max-width: 900px; margin: 0 auto;">
    
    <div class="history-header-wrapper" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; border-bottom: 1px solid var(--hero-border, #d4ded0); padding-bottom: 1.5rem;">
      <div class="history-text-group">
        <h1 class="history-title" style="font-size: 2.5rem; font-weight: 800; color: var(--hero-text-main, #0c1c13); margin-bottom: 0.3rem;">History</h1>
        <p class="history-subtitle" style="color: var(--hero-text-muted, #4d6354); font-size: 1.05rem;">Your recent emotion analyses.</p>
      </div>
  
      <!-- Clear History Button with High Contrast Red Accent -->
      <button class="btn-clear-action" onclick="clearAllHistory()" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1.2rem; cursor: pointer; background: rgba(239, 68, 68, 0.1); border: 1.5px solid #ef4444; color: #dc2626; border-radius: 10px; font-weight: 700; transition: all 0.2s ease;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Clear All</span>
      </button>
    </div>

    <!-- Empty State Dark Card -->
    <div id="history-empty" class="feature-card empty-state fade-in" style="text-align: center; padding: 4rem 2rem; background-color: var(--dark-card, #12281c); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;">
      <div class="feature-icon" style="margin: 0 auto 1.5rem auto; background-color: #a8c3b0; border-radius: 50%; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#12281c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <h3 style="font-size: 1.4rem; font-weight: 700; color: #f2f5ee; margin-bottom: 0.5rem;">No history yet</h3>
      <p style="color: #9bb8a9; font-size: 1rem; margin-bottom: 1.8rem;">Your recent detections will appear here.</p>
      <a class="btn-detect-primary" href="detect.html" style="text-decoration: none; display: inline-flex; background-color: #0e2a1a; color: #ffffff; padding: 0.85rem 1.8rem; border-radius: 10px; font-weight: 700; border: 1px solid #22c55e;">Try detecting an emotion →</a>
    </div>
    
    <!-- History List Render Area -->
    <div id="history-list" class="history-list" style="display:none; display: flex; flex-direction: column; gap: 1rem;"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
