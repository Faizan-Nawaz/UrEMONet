<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History — UrEMONet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <div class="nav-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="Black" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4C12 9 15 12 20 12C15 12 12 15 12 20C12 15 9 12 4 12C9 12 12 9 12 4Z" fill="none" />
    
            <circle cx="5.5" cy="17.5" r="2.2" fill="none" />
    
            <path d="M18 4.5H22M20 2.5V6.5" stroke="Black" stroke-width="1.9" />
        </svg>
    </div>
    <span>UrEMONet</span>
  </a>

  <ul class="nav-links">
    <li><a href="index.html" id="nav-home">Home</a></li>
    <li><a href="detect.html" id="nav-detect">Detect</a></li>
    <li><a href="history.html" id="nav-history" class="active">History</a></li>
    <li><a href="about.html" id="nav-about">About</a></li>
  </ul>

  <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle dark mode">
    <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>
</nav>

<div class="page active" id="page-history">
  <div class="history-container">
    
    <div class="history-header-wrapper">
      <div class="history-text-group">
        <h1 class="history-title">History</h1>
        <p class="history-subtitle">Your recent emotion analyses.</p>
      </div>
  
      <button class="history-clear-btn" onclick="clearAllHistory()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Clear</span>
      </button>
    </div>

    <div id="history-empty" class="empty-state fade-in">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <h3>No history yet</h3>
      <p>Your recent detections will appear here.</p>
      <a class="empty-link" href="detect.html">Try detecting an emotion →</a>
    </div>
    
    <div id="history-list" class="history-list" style="display:none"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
