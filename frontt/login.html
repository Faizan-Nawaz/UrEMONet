<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — UrEMONet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="background-color: #e8f0e8; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">

  <div style="background: #12281c; padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid rgba(255, 255, 255, 0.1); color: #f2f5ee;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 2rem; font-weight: 800; color: #22c55e; margin-bottom: 0.5rem;">UrEMONet</h2>
      <p style="color: #9bb8a9; font-size: 0.95rem;">Log in to save your emotion history</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div style="margin-bottom: 1.2rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #9bb8a9; margin-bottom: 0.4rem;">Email Address</label>
        <input type="email" id="login-email" required placeholder="name@example.com" style="width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #22c55e; background: #1b3528; color: #fff; box-sizing: border-box;" />
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #9bb8a9; margin-bottom: 0.4rem;">Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #22c55e; background: #1b3528; color: #fff; box-sizing: border-box;" />
      </div>

      <button type="submit" style="width: 100%; padding: 0.85rem; background: #22c55e; color: #0e2a1a; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem;">Log In</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #9bb8a9;">
      Don't have an account? <a href="signup.html" style="color: #22c55e; text-decoration: none; font-weight: 600;">Sign Up</a>
    </div>
    
    <div style="text-align: center; margin-top: 1rem;">
      <a href="detect.html" style="color: #9bb8a9; font-size: 0.85rem; text-decoration: underline;">Continue as Guest (No History)</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
